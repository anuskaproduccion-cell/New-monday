name: Read-only published New Monday audit

on:
  push:
    branches: [agent/monday-engine-v2]

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[audit-prod-readonly]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check scripts/auditPublishedNewMondayReadOnly.js
      - name: Audit currently published New Monday via GET only
        env:
          NEW_MONDAY_PUBLISHED_URL: https://new-monday.onrender.com
        run: |
          echo "Read-only audit: only GET requests are permitted by the script."
          node scripts/auditPublishedNewMondayReadOnly.js
