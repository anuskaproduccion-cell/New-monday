name: New Monday group and timeline parity validation

on:
  push:
    branches: [agent/monday-group-parity]
  pull_request:
    branches: [main]

jobs:
  validate-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Syntax checks
        run: |
          node --check public/js/app-v2.js
          node --check public/js/app-v2-concurrency-parity.js
          node --check public/js/app-v2-core-parity.js
          node --check public/js/app-v2-groups.js
          node --check public/js/app-v2-timeline.js
          node --check public/js/app-v2-gantt-parity.js
          node --check public/js/app-v2-gantt-color-parity.js
          node --check public/js/app-v2-gantt-config-parity.js
          node --check public/js/app-v2-date-parity.js
          node --check public/js/app-v2-people.js
          node --check public/js/app-v2-people-settings-parity.js
          node --check public/js/app-v2-world-clock-parity.js
          node --check public/js/app-v2-status-parity.js
          node --check public/js/app-v2-dependency-parity.js
          node --check public/js/app-v2-subitems-parity.js
          node --check public/js/app-v2-subitem-schema-parity.js
          node --check public/js/app-v2-dropdown-parity.js
          node --check public/js/app-v2-inline-item.js
          node --check public/js/app-v2-group-summary.js
          node --check public/js/app-v2-collapsed-group-parity.js
          node --check public/js/app-v2-column-menu-parity.js
          node --check public/js/app-v2-updates-parity.js
          node --check public/js/app-v2-updates-files-parity.js
          node --check public/js/app-v2-mentions-parity.js
          node --check public/js/app-v2-updates-rich-parity.js
          node --check public/js/app-v2-dnd.js
          node --check public/js/app-v2-columns.js
          node --check public/js/app-v2-column-parity.js
          node --check public/js/app-v2-relational.js
          node --check public/js/app-v2-relational-parity.js
          node --check public/js/app-v2-relational-multiboard-parity.js
          node --check public/js/app-v2-files-parity.js
          node --check public/js/app-v2-files-view-parity.js
          node --check public/js/app-v2-file-preview-parity.js
          node --check public/js/app-v2-contact-parity.js
          node --check public/js/app-v2-view-parity.js
          node --check public/js/app-v2-view-menu-parity.js
          node --check public/js/app-v2-view-overflow-parity.js
          node --check public/js/app-v2-column-resize.js
          node --check public/js/app-v2-board-header-parity.js
          node --check public/js/app-v2-board-advanced-parity.js
          node --check public/js/app-v2-board-archive-parity.js
          node --check public/js/app-v2-board-workspace-parity.js
          node --check public/js/app-v2-sidebar-parity.js
          node --check public/js/app-v2-sidebar-hierarchy-parity.js
          node --check public/js/app-v2-item-menu-parity.js
          node --check public/js/app-v2-save-state-parity.js
          node --check public/js/app-v2-popover-parity.js
          node --check public/js/app-v2-menu-keyboard-parity.js
