          node --check public/js/app-v2-virtualization-index-parity.js
          node --check public/js/app-v2-mutation-tracking-parity.js
          node --check public/js/app-v2-realtime-parity.js
          node --check public/js/app-v2-realtime-batch-parity.js
          node --check models/Board.js
          node --check models/Workspace.js
          node --check models/ItemUpdate.js
          node --check routes/boardOperations.js
          node --check routes/boards.js
          node --check routes/items.js
          node --check routes/views.js
          node --check routes/itemOrdering.js
          node --check routes/workspaces.js
          node --check routes/updates.js
          node --check routes/files.js
          node --check routes/realtime.js
          node --check routes/subitemSchema.js
          node --check services/realtimeHub.js
          node --check services/stagingPromotion.js
          node --check server.js
