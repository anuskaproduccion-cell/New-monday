name: New Monday Drive snapshot backup

on:
  push:
    branches: [agent/drive-backup-2026-08-25]

permissions:
  contents: write

jobs:
  backup:
    if: contains(github.event.head_commit.message, '[drive-backup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build restorable source snapshot
        run: |
          set -euo pipefail
          mkdir -p backup-output
          git archive --format=zip --output=backup-output/NEW_MONDAY_SOURCE_2026-08-25.zip HEAD
          cat > backup-output/NEW_MONDAY_SOURCE_MANIFEST_2026-08-25.json <<EOF
          {
            "backupPurpose": "Drive restorable checkpoint before continuing Monday UI parity work",
            "snapshotBranch": "${GITHUB_REF_NAME}",
            "snapshotSha": "${GITHUB_SHA}",
            "productionMainSha": "37b537c94ba8839ddb0fe3a9abe5ff8895bca492",
            "includesInProgressGroupParity": true,
            "productionDataExcelIncluded": false,
            "productionDataExcelReason": "MONGODB_URI is held in Render and was not copied into GitHub Actions",
            "mondayWrites": 0,
            "createdAtUtc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          sha256sum backup-output/NEW_MONDAY_SOURCE_2026-08-25.zip > backup-output/SHA256SUMS.txt
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-monday-drive-backup-2026-08-25
          path: backup-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Record backup workflow result
        if: always()
        env:
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# New Monday Drive backup result'
            echo
            echo "- outcome: ${RESULT}"
            echo "- workflowRunId: ${RUN_ID}"
            echo "- snapshotSha: ${HEAD_SHA}"
            echo "- recordedAtUtc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo '- source: full git archive of current in-progress branch'
            echo '- data Excel: not included; production Mongo secret remains only in Render'
            echo '- Monday writes: 0'
          } > docs/DRIVE_BACKUP_RESULT.md
          git config user.name 'new-monday-backup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/DRIVE_BACKUP_RESULT.md
          git commit -m 'Record Drive backup workflow result' || true
          git push
