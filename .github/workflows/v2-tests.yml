name: New Monday v2 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/monday-engine-v2]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - name: Syntax checks
        run: |
          node --check server.js
          node --check models/Workspace.js
          node --check models/Board.js
          node --check models/Item.js
          node --check models/ImportRun.js
          node --check models/StagingWorkspace.js
          node --check models/StagingBoard.js
          node --check models/StagingItem.js
          node --check models/ExcelRecoveryRun.js
          node --check models/ActivityEvent.js
          node --check models/ItemUpdate.js
          node --check routes/workspaces.js
          node --check routes/views.js
          node --check routes/boards.js
          node --check routes/items.js
          node --check routes/itemOrdering.js
          node --check routes/mondayImport.js
          node --check routes/backups.js
          node --check routes/updates.js
          node --check routes/activity.js
          node --check services/mondayReadOnlyClient.js
          node --check services/mondayNormalizer.js
          node --check services/mondayStagingImporter.js
          node --check services/stagingFingerprint.js
          node --check services/stagingPromotion.js
          node --check services/excelBackup.js
          node --check services/excelRecovery.js
          node --check services/driveBackup.js
          node --check services/activityLogger.js
          node --check services/dependencyEngine.js
          node --check services/formulaEngine.js
          node --check scripts/runIsolatedMondayStaging.js
          node --check scripts/syncBackupToDrive.js
          node --check public/js/app-v2.js
          node --check public/js/app-v2-dnd.js
          node --check public/js/app-v2-backup.js
          node --check public/js/app-v2-query.js
          node --check public/js/app-v2-updates.js
          node --check public/js/app-v2-lifecycle.js
          node --check public/js/app-v2-columns.js
          node --check public/js/app-v2-relational.js
          node --check public/js/app-v2-keyboard.js
          node --check public/js/app-v2-range.js
      - name: STAGING secret availability preflight
        env:
          STAGING_URI: ${{ secrets.MONGODB_STAGING_URI }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          PRODUCTION_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -n "$STAGING_URI" ]; then echo "MONGODB_STAGING_URI_CONFIGURED=true"; else echo "MONGODB_STAGING_URI_CONFIGURED=false"; fi
          if [ -n "$MONDAY_TOKEN" ]; then echo "MONDAY_API_TOKEN_CONFIGURED=true"; else echo "MONDAY_API_TOKEN_CONFIGURED=false"; fi
          if [ -n "$PRODUCTION_URI" ]; then echo "MONGODB_URI_CONFIGURED=true"; else echo "MONGODB_URI_CONFIGURED=false"; fi
          echo "No secret values are printed by this preflight."
      - name: Explicit isolated STAGING execution
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-staging]')
        env:
          MONGODB_STAGING_URI: ${{ secrets.MONGODB_STAGING_URI }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          if [ -z "$MONGODB_STAGING_URI" ] || [ -z "$MONDAY_API_TOKEN" ]; then
            echo "STAGING execution blocked: required repository secrets are not configured."
            exit 1
          fi
          echo "Explicit [run-staging] trigger accepted. Monday remains read-only; production promotion is not part of this workflow."
          npm run staging:isolated
