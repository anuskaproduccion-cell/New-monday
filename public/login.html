<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Acceso · New Monday</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #323338; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(430px, 100%); background: #fff; border: 1px solid #dfe1e6; border-radius: 14px; box-shadow: 0 18px 50px rgba(30,31,41,.10); padding: 34px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; font-size: 20px; font-weight: 750; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: #6161ff; color: white; font-weight: 800; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; }
    p { margin: 0 0 24px; color: #676879; line-height: 1.5; }
    label { display: block; font-weight: 650; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #bfc4d1; border-radius: 8px; padding: 12px 13px; font: inherit; outline: none; }
    input:focus { border-color: #6161ff; box-shadow: 0 0 0 3px rgba(97,97,255,.12); }
    button { width: 100%; margin-top: 16px; border: 0; border-radius: 8px; padding: 12px 16px; background: #6161ff; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .error { min-height: 22px; margin-top: 12px; color: #d83a52; font-size: 14px; }
    .note { margin-top: 24px; padding-top: 18px; border-top: 1px solid #eceef3; color: #8a8d9f; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">M</span><span>New Monday</span></div>
    <h1>Acceso protegido</h1>
    <p>Introduce la contraseña de New Monday para abrir la herramienta.</p>
    <form id="login-form">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Entrar</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="note">La sesión se guarda en una cookie segura y no expone la contraseña al navegador después del acceso.</div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
